services:
  - type: web
    name: cuida-demo
    runtime: python
    plan: starter
    buildCommand: python -m py_compile tools/render_server.py CURA/api.py
    startCommand: python tools/render_server.py
    healthCheckPath: /healthz
    disk:
      name: cuida-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/readings.sqlite3
      - key: DEVICE_TOKEN
        generateValue: true
