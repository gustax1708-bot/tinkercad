services:
  - type: web
    name: cuida-plus-api
    runtime: python
    plan: starter
    rootDir: CURA
    buildCommand: python -m compileall -q .
    startCommand: python api.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: API_HOST
        value: 0.0.0.0
      - key: DEVICE_TOKEN
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/readings.sqlite3
      - key: API_CORS_ORIGINS
        value: http://localhost:8080,https://gustax1708-bot.github.io
    disk:
      name: cuida-plus-readings
      mountPath: /var/data
      sizeGB: 1
