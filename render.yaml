services:
  - type: web
    name: cuida-plus-api
    runtime: python
    plan: free
    rootDir: CURA
    buildCommand: pip install -r requirements.txt
    startCommand: python api.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: API_HOST
        value: 0.0.0.0
      - key: DEVICE_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: API_CORS_ORIGINS
        value: http://localhost:8080,https://gustax1708-bot.github.io
